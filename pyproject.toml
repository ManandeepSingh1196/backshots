[project]
name = "backshots"
version = "0.1.0"
description = "Honest crypto backtesting engine"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.90",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "plotext>=6.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[project.scripts]
bt = "bt.cli.main:app"

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bt"

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".worktrees", "data", "runs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "DTZ", "ANN", "PT", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "strategies", "tests"]
exclude = [".worktrees", ".venv", "data", "runs", "**/__pycache__"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".worktrees", ".venv", "data", "runs", ".git", ".hypothesis"]
addopts = "--strict-markers"
xfail_strict = true
pythonpath = ["."]
